name: Docker Publish (Harbor multi-arch)

# Builds linux/amd64 + linux/arm64 image and pushes to internal Harbor.
#
# Registry:   docker.weloyalty.net
# Project:    devtools
# Repository: everything-claude-code
#
# Required repo secrets:
#   HARBOR_USERNAME  - robot account name, e.g. robot$devtools+ci
#   HARBOR_TOKEN     - robot account secret (generated in Harbor UI)
#
# Triggers:
#   - push to main           -> tag :latest + :main
#   - push tag v*            -> tag :v1.2.3 + :1.2 + :1
#   - manual workflow_dispatch

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'docker/**'
      - 'agents/**'
      - 'commands/**'
      - 'skills/**'
      - 'rules/**'
      - 'hooks/**'
      - 'install.sh'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  HARBOR_REGISTRY: docker.weloyalty.net
  HARBOR_PROJECT: devtools
  IMAGE_NAME: everything-claude-code

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        if: always()
        run: |
          echo "### Pushed tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Harbor UI: https://${{ env.HARBOR_REGISTRY }}/harbor/projects" >> "$GITHUB_STEP_SUMMARY"
